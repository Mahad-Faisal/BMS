<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ESP32 container -->
  <rect x="15" y="20" width="210" height="280" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ESP32</text>
  <text x="120" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Battery plant node</text>

  <!-- ESP32: 2RC Thevenin -->
  <rect x="33" y="82" width="174" height="54" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="120" y="102" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">2RC Thevenin plant</text>
  <text x="120" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Panasonic 18650PF</text>

  <!-- ESP32: 8s2p -->
  <rect x="33" y="146" width="174" height="54" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="120" y="166" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">8s2p pack I/O</text>
  <text x="120" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">I_cell = I/2, V = 8·Vc</text>

  <!-- ESP32: MCP2515 -->
  <rect x="33" y="210" width="174" height="54" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="120" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">MCP2515</text>
  <text x="120" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">SPI CAN 2.0 controller</text>

  <!-- CAN bus arrow -->
  <line x1="225" y1="237" x2="350" y2="237" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <text x="288" y="222" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#854F0B">CAN 2.0B</text>
  <text x="288" y="255" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">Vt, Ipack</text>

  <!-- RA8M1 container -->
  <rect x="350" y="20" width="315" height="280" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="508" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">RA8M1 (Cortex-M85)</text>
  <text x="508" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">ADEKF estimator node</text>

  <!-- RA8M1: ADEKF -->
  <rect x="368" y="82" width="279" height="54" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="508" y="102" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">ADEKF estimator</text>
  <text x="508" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">SoC, V_RC1, V_RC2 per cell</text>

  <!-- RA8M1: Dual EKF -->
  <rect x="368" y="146" width="279" height="54" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="508" y="166" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Dual EKF + adaptive Q/R</text>
  <text x="508" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">State EKF + parameter EKF</text>

  <!-- RA8M1: FreeRTOS/TJA1042T -->
  <rect x="368" y="210" width="279" height="54" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="508" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">FreeRTOS / TJA1042T</text>
  <text x="508" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">3-task arch, J62 transceiver</text>
</svg>
